function ctype(){if(Date.now()-CH.tt>3000){CH.tt=Date.now();kv('ty_'+me(),Date.now())}}
function cphoto(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cpost({kind:'i',data:c.toDataURL('image/jpeg',.55)})};im.src=r.result};r.readAsDataURL(f);el.value=''}
async function cvoice(){if(CH.rec){CH.rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(s),ch=[];CH.rec=mr;mr.ondataavailable=e=>ch.push(e.data);
mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());CH.rec=null;$('#cv').textContent='🎤';const r=new FileReader();r.onload=()=>cpost({kind:'a',data:r.result});r.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};mr.start();$('#cv').textContent='⏹';setTimeout(()=>CH.rec&&CH.rec.stop(),60000)}catch(e){toast('Microphone not allowed')}}

function cact(id){const c=cmsg(id);if(!c)return;show(`<div class="btns">${RX.map(e=>`<button onclick="crx(${id},'${e}')">${e}</button>`).join('')}</div><div class="btns"><button onclick="CH.rep=${id};$('#md').classList.remove('show');paintChat()">↩ Reply</button><button onclick="cp(${JSON.stringify(c.txt||'').replace(/"/g,'&quot;')})">Copy</button><button onclick="window.open('https://wa.me/?text='+encodeURIComponent(${JSON.stringify(c.txt||'').replace(/"/g,'&quot;')}))">Send on WhatsApp</button><button onclick="ST.star[${id}]=ST.star[${id}]?0:1;save();$('#md').classList.remove('show');paintChat()">⭐ Star</button>${c.who==me()||me()=='a'?`<button onclick="cdel(${id})">🗑 Delete for everyone</button>`:''}</div>`)}
async function crx(id,e){const c=cmsg(id),r={...(c.rx||{})};const a=new Set(r[e]||[]);a.has(me())?a.delete(me()):a.add(me());r[e]=[...a];c.rx=r;$('#md').classList.remove('show');paintChat();try{await sbf('yatra_chat?id=eq.'+id,{method:'PATCH',body:JSON.stringify({rx:r})})}catch(x){}}

function chatView(){if(!SB.url)return '<h2 class="orh">Group chat</h2><div class="card"><p>The family chat starts working once Supabase is switched on (setup SQL is in the notes at the top of this file).</p><p class="mut">Until then, use the Share buttons to send tickets and images on WhatsApp.</p></div>';
return `<h2 class="orh">Group chat</h2><input id="cs" type="search" placeholder="Search messages" style="width:100%;margin-bottom:6px" oninput="CH.q=this.value;paintChat()"><div id="cl" class="chat">${chatHTML()}</div><div id="ct" class="mut" style="min-height:18px"></div><div id="cq2"></div>
<div class="comp"><input id="ci" type="text" placeholder="Message" oninput="ctype()" onkeydown="if(event.key=='Enter')csend()"><label class="ib">📷<input type="file" accept="image/*" hidden onchange="cphoto(this)"></label><button class="ib" id="cv" onclick="cvoice()">🎤</button><button class="ib" onclick="cloc()">📍</button><button class="p" onclick="csend()">Send</button></div>`}
// ---------- login and people ----------
const SALT='yatra26|';
async function sha(t){if(typeof crypto!='undefined'&&crypto.subtle)return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');let h=5381;for(const ch of SALT+t)h=(h*33^ch.charCodeAt(0))>>>0;return 'x'+h}
const NAMES=Object.keys(P),opts=(sel)=>NAMES.map(k=>`<option value="${k}" ${sel==k?'selected':''}>${P[k]}</option>`).join('');
function loginUI(mode,msg){const e=$('#lg');e.classList.add('show');const h={in:`<h3>Log in</h3><select id="lu" onchange="loginUI('in')">${opts($('#lu')?$('#lu').value:'a')}</select><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="PIN">${$('#lu')&&!ST.auth[$('#lu').value]?'<p class="mut">This name is not registered yet. Tap Register.</p>':''}<div class="btns"><button class="p" onclick="doLogin()">Log in</button><button onclick="loginUI('reg')">Register</button><button onclick="loginUI('fg')">Forgot PIN</button></div>`,
reg:`<h3>Register</h3><select id="lu">${opts('a')}</select><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="Choose a PIN (4 to 6 digits)"><input id="lp2" type="password" inputmode="numeric" maxlength="6" placeholder="Repeat the PIN"><input id="la" type="text" placeholder="Recovery: your grandmother's name"><div class="btns"><button class="p" onclick="doReg()">Register</button><button onclick="loginUI('in')">Back</button></div>`,
fg:`<h3>Forgot PIN</h3><select id="lu">${opts('a')}</select><input id="la" type="text" placeholder="Your grandmother's name"><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (4 to 6 digits)"><div class="btns"><button class="p" onclick="doFg()">Set new PIN</button><button onclick="loginUI('in')">Back</button></div><p class="mut">If you cannot remember, ask Ashish to reset your PIN.</p>`}[mode];
e.innerHTML=`<div class="lbox"><div class="lorn">${orn}</div><h2>Yatra Portal 2026</h2>${msg?`<p class="err">${msg}</p>`:''}${h}${SB.url?'':'<p class="mut">Registrations are saved on this phone only until the shared database is switched on.</p>'}</div>`}
function enter(u){ST.sess=ST.me=u;save();$('#lg').classList.remove('show');render()}
async function doLogin(){const u=$('#lu').value,a=ST.auth[u];if(!a)return loginUI('in','Not registered yet. Tap Register.');if(await sha($('#lp').value)!=a.p)return loginUI('in','Wrong PIN');enter(u)}
async function doReg(){await pull();const u=$('#lu').value,p=$('#lp').value;if(ST.auth[u])return loginUI('reg','Already registered. Use Log in, or Forgot PIN.');if(!/^\d{4,6}$/.test(p))return loginUI('reg','PIN must be 4 to 6 digits');if(p!=$('#lp2').value)return loginUI('reg','The two PINs do not match');const q=$('#la').value.trim().toLowerCase();if(!q)return loginUI('reg','Enter your grandmother\'s name');
ST.auth[u]={p:await sha(p),q:await sha(q)};save('auth');enter(u)}
async function doFg(){await pull();const u=$('#lu').value,a=ST.auth[u],p=$('#lp').value;if(!a||!a.q)return loginUI('fg','No recovery answer saved. Ask Ashish to reset your PIN.');if(!/^\d{4,6}$/.test(p))return loginUI('fg','New PIN must be 4 to 6 digits');if(await sha($('#la').value.trim().toLowerCase())!=a.q)return loginUI('fg','That is not the saved answer');a.p=await sha(p);save('auth');enter(u)}
function logout(){ST.sess=ST.me='';save();loginUI('in')}
async function admSet(u){const p=prompt('New PIN for '+P[u]+' (4 to 6 digits)');if(!p)return;if(!/^\d{4,6}$/.test(p))return toast('PIN must be 4 to 6 digits');ST.auth[u]={...(ST.auth[u]||{}),p:await sha(p)};save('auth');render();toast('PIN set for '+P[u])}
function admClr(u){if(!confirm('Remove registration of '+P[u]+'?'))return;delete ST.auth[u];save('auth');render()}
function viewAs(u){ST.me=u;save();render()}
function saveLL(){const v=$('#ll').value.trim();if(v&&!/^https:\/\//.test(v))return toast('Paste the full link starting with https://');ST['ll_'+me()]=v;save('ll_'+me());render();toast('Saved')}
let WID;function locOn(){if(!navigator.geolocation||WID)return;let last=0;WID=navigator.geolocation.watchPosition(p=>{if(Date.now()-last<3e4)return;last=Date.now();ST['loc_'+me()]={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()};save('loc_'+me())},()=>{},{enableHighAccuracy:true})}

function peopleView(){const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'};
return `<h2 class="orh">People and live location</h2><div class="card mine"><b>Share your location until you turn it off</b><ol style="margin:6px 0;padding-left:20px"><li>Open Google Maps, tap your profile picture, then Location sharing.</li><li>Choose New share, set it to "Until you turn this off", and copy the link.</li><li>Paste the link here once. Google Maps keeps sharing in the background, even when this page is closed.</li></ol><input id="ll" type="url" placeholder="Paste your Google Maps share link" value="${ST['ll_'+me()]||''}" style="width:100%;margin:4px 0"><div class="btns"><button class="p" onclick="saveLL()">Save my link</button></div></div>`+'akshltud'.split('').map(p=>{const l=ST['loc_'+p],k=ST['ll_'+p];return `<div class="card"><div class="row"><b>${P[p]}</b><span class="mut">${k?'live link added':l?'seen '+ago(l.ts):'location not shared'}</span></div><div class="btns">${k?`<a class="btn p" href="${k}" target="_blank" rel="noopener">Open live location</a>`:''}${l?`<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener">Directions to last seen spot</a>`:''}</div></div>`}).join('')+
`<h3 class="orh" style="margin-top:18px">Backup: share only while this page is open</h3><label class="t"><input type="checkbox" ${ST.loc?'checked':''} onchange="locToggle(this.checked)"><span>Send my position from this page (stops when the page is closed)</span></label>`+
(ST.sess=='a'?`<h3 class="orh" style="margin-top:18px">Admin: logins</h3>${NAMES.map(u=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--soft)"><span>${P[u]} <span class="mut">${ST.auth[u]?'registered':'not registered'}</span></span><span class="btns" style="margin:0"><button onclick="admSet('${u}')">Set PIN</button>${ST.auth[u]?`<button onclick="admClr('${u}')">Clear</button>`:''}<button onclick="viewAs('${u}')">View as</button></span></div>`).join('')}`:'');}

function legsOf(p){return[...T.filter(t=>px(t[8]).some(x=>x[0]==p)).map(t=>({s:D(t[4]),a:`${t[1]} ${TR[t[1]][0]}`,b:`${t[2]} ${ft(D(t[4]))} → ${t[3]} ${ft(D(t[5]))}  (${fd(D(t[4]))})`,c:`Seat ${sT(t,p)} · PNR ${t[0]}`})),...S.filter(s=>s[5].includes(p)).map(s=>({s:D(s[2]),a:`Stay: ${s[1]}`,b:s[0],c:`In ${fd(D(s[2]))} ${ft(D(s[2]))} · out ${fd(D(s[3]))} ${ft(D(s[3]))}`}))].sort((x,y)=>x.s-y.s)}
function shareImg(p){const ps=p=='all'?'akshltud'.split(''):[p],lines=[];ps.forEach(q=>{lines.push({h:P[q]});legsOf(q).forEach(l=>{lines.push({t:l.a,b:1});lines.push({t:l.b});lines.push({t:l.c,g:1})})});
const W=1080,c=document.createElement('canvas'),x=c.getContext('2d'),acc=getComputedStyle(document.body).getPropertyValue('--acc').trim()||'#8c1c2b',hh=l=>l.h?84:l.b?40:34;c.width=W;c.height=130+lines.reduce((a,l)=>a+hh(l),0)+40;
x.fillStyle='#fffaf0';x.fillRect(0,0,W,c.height);x.fillStyle=acc;x.fillRect(0,0,W,100);x.fillStyle='#d4a017';x.fillRect(0,100,W,6);x.fillStyle='#fff';x.font='700 44px Georgia,serif';x.fillText('Yatra 2026 · '+(p=='all'?'Everyone':P[p]),30,66);
let y=130;lines.forEach(l=>{if(l.h){x.fillStyle=acc;x.fillRect(0,y,W,56);x.fillStyle='#fff';x.font='700 34px Georgia,serif';x.fillText(l.h,30,y+40)}else{x.fillStyle=l.g?'#555':'#222';x.font=(l.b?'700 30px':'26px')+' system-ui,sans-serif';x.fillText(l.t,30,y+26)}y+=hh(l)});
c.toBlob(async b=>{const f=new File([b],'yatra-'+p+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Yatra 2026'});return}catch(e){}}dl(b,f.name)})}
function ics(){const z=n=>String(n).padStart(2,'0'),f=d=>`2026${z(d.getMonth()+1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`,out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Yatra//EN'];
const ev=(u,s,e,t,al)=>{out.push('BEGIN:VEVENT','UID:'+u+'@yatra','DTSTAMP:20261101T000000','DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+t,...al.flatMap(m=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t,'TRIGGER:-PT'+m+'M','END:VALARM']),'END:VEVENT')};
mineT().forEach(t=>{ev(t[0]+'d',D(t[4]),D(t[5]),`Train ${t[1]} ${t[2]} to ${t[3]} · ${sT(t,me())}`,[120,15]);ev(t[0]+'a',new Date(D(t[5])-9e5),D(t[5]),`Arriving ${t[3]} (${t[1]})`,[0])});
S.filter(s=>s[5].includes(me())).forEach(s=>ev(s[7],D(s[2]),D(s[3]),`Stay: ${s[1]} · ${s[0]}`,[120]));out.push('END:VCALENDAR');dl(new Blob([out.join('\r\n')],{type:'text/calendar'}),'yatra-alarms.ics')}
function todoView(){return '<h2 class="orh">To do</h2>'+TODO.map(([id,x])=>`<label class="t"><input type="checkbox" ${ST.todo.includes(id)?'checked':''} onchange="tg('${id}',this.checked)"><span>${x}</span></label>`).join('')}

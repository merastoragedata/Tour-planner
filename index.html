const HIR=[[/^check-out (.+)$/,'चेक-आउट $1'],[/^until (.+)$/,'तक $1'],[/^(.+) · in (.+)$/,'$1 · $2 में'],[/^Check-in (.+)$/,'चेक-इन $1'],[/^In (.+) · out (.+)$/,'आगमन $1 · प्रस्थान $2'],[/^(At|On the way to) (.+)$/,(m,a,b)=>(a=='At'?'स्थान: ':'जा रहे हैं: ')+b],[/^(\d+) days to the yatra$/,'यात्रा में $1 दिन बाकी'],[/^Hello (.+)$/,'नमस्ते $1'],[/^(\d+) items$/,'$1 प्रविष्टियाँ'],[/^Next up · (.+)$/,'अगला · $1'],[/^In (\S+) → out/,'In $1 → out'],[/^Page (\d+) of (\d+)/,'पृष्ठ $1 / $2'],[/^Seat (.+)$/,'सीट $1'],[/\+(\d+) min late/,'+$1 मिनट देरी'],[/^Past alarms \((\d+)\)$/,'पिछले अलार्म ($1)'],[/^(.+)'s statement$/,'$1 का विवरण'],[/^(.+) · today$/,'$1 · आज'],[/^(.+): share (.+)$/,'$1: हिस्सा $2'],[/^Paid by (.+)$/,'भुगतानकर्ता: $1'],[/^Excel: (.+)$/,'एक्सेल: $1'],[/^PDF: (.+)$/,'PDF: $1'],[/^Total (.+)$/,'कुल $1']];

HIT.sort((a,b)=>b[0].length-a[0].length);
let HIBUSY=false;
function hiText(s){const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s),t=m[2];if(!t)return s;if(HI[t])return m[1]+HI[t]+m[3];let r=t;for(const[re,to]of HIR){if(re.test(r)){r=r.replace(re,to);break}}for(const[a,b]of HIT){if(r.includes(a))r=r.split(a).join(b)}return m[1]+r+m[3]}
function hiPass(root){if(ST.lang!='hi'||!root||HIBUSY)return;HIBUSY=true;try{if(root.nodeType==3){const p=root.parentElement;if(p&&!p.closest('script,style,textarea,.msg>div,.nohi')){const v=hiText(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}}
else if(root.nodeType==1){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('script,style,textarea,.msg>div,.nohi')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;while(n=w.nextNode()){const v=hiText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>['placeholder','title','aria-label'].forEach(a=>{const x=e.getAttribute(a);if(x&&HI[x.trim()])e.setAttribute(a,HI[x.trim()])}))}}finally{HIBUSY=false}}
new MutationObserver(ms=>{if(ST.lang!='hi'||HIBUSY)return;ms.forEach(m=>m.addedNodes.forEach(n=>hiPass(n)))}).observe(document.body,{childList:true,subtree:true});

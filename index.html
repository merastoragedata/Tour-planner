DATA: T=tickets, S=stays, SG=sightseeing, PEND=to book/decide, TODO, TR=train info (TR[no][1] is the date to pick in Where Is My Train = the date the train starts from its origin), RAKE=coach order per train (only 11756 so far, from owner's screenshot), DT=deity/temple cards, LINKS, PINS, XY=weather coordinates. Berth type is computed from number: 3A/SL/3E 8 berths per compartment (1LB 2MB 3UB 4LB 5MB 6UB 7SL 8SU); 2A 6 per compartment. Coach plan shows each compartment like Where Is My Train: rows (1,2,3 + side lower) and (4,5,6 + side upper).
SHARED STATE (needs Supabase, not yet configured): keys paid, todo, swaps, delay, exp, img_<id>, loc_<person> in table yatra_kv; chat in table yatra_chat. Without Supabase everything works per phone only. SQL: create table public.yatra_kv(key text primary key, val jsonb, updated_at timestamptz default now()); create table public.yatra_chat(id bigserial primary key, who text, txt text, ts timestamptz default now()); alter table public.yatra_kv enable row level security; alter table public.yatra_chat enable row level security; create policy "all" on public.yatra_kv for all to anon using(true) with check(true); create policy "all" on public.yatra_chat for all to anon using(true) with check(true); grant select,insert,update,delete on public.yatra_kv to anon; grant select,insert on public.yatra_chat to anon; grant usage,select on sequence public.yatra_chat_id_seq to anon;  (explicit grants needed after the 30 Oct 2026 Data API change). Then fill SB.url and SB.key.
FILES: original tickets tickets/<PNR>.pdf ; stay vouchers stays/<id>.pdf ; deity photos images/<slug>.jpg (slug = lowercase title with dashes); all optional.
DONE (v3 additions): account report as Excel (.xlsx, built in the browser, no library) and PDF with sheets Summary / Train expenses / Stay expenses (includes expenses added with category Stay extra) / Other expenses; expense categories Train ticket and Stay extra feed the train and stay groups; report styling: black title and section bands with white text, grey column headers, black text on white cells (owner asked for black background and black font; interpreted this way, confirm). Live location: browsers cannot track in the background, so each person pastes a Google Maps 'Until you turn this off' share link (stored as ll_<person>); page-based sharing kept only as backup.

document.body.insertAdjacentHTML('beforeend','<div id="toast"></div>');
$('#me').innerHTML=Object.keys(P).map(k=>`<option value="${k}">${P[k]}</option>`).join('');$('#me').value=ST.me;
$('#me').onchange=e=>pick(e.target.value);

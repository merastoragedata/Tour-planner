# Keeps the free Supabase project awake (free projects pause after 7 days without activity).
# Runs every 3 days and sends one small read request to the database.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/yatra_kv?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo
          echo "Supabase answered at $(date -u)"
